name: CI

# Runs the test suite on every push and pull request so changes that break
# the pipeline are caught automatically.

on:
  push:
    branches: [main, v13-honest-labels]
  pull_request:
    branches: [main, v13-honest-labels]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The test suite (config / preprocessing / detection) deliberately does
      # NOT require TensorFlow, so we install only the lightweight scientific
      # stack here. This keeps CI fast (no multi-hundred-MB TF download) while
      # still validating the audio→spectrogram→detection logic end to end.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn librosa soundfile opencv-python-headless pytest

      - name: Run tests
        run: pytest tests/ -v

      # The two guards for the project's one hard rule: C. guereza is hunted,
      # a recorder position is a place to wait for one, and no coordinate may
      # reach anything public. Both read tracked text only, so they need no
      # data and no TensorFlow, and they run in seconds.
      #
      # They were run by hand until 2026-08-31, which is to say the rule was
      # enforced by someone remembering. An audit that week found a coordinate
      # disclosure that had been reintroduced into the very file written to
      # remove it. Remembering is not a control.
      #
      # Not added here: verify_manuscript_numbers.py. It recomputes every claim
      # from CSVs under data/, which is gitignored, so in CI it would SKIP
      # everything and report success -- a check that cannot fail, which this
      # repository has been bitten by before and will not ship again.
      - name: No coordinates, keys or tokens in tracked files
        run: python scripts/check_no_coordinates.py

      - name: No prose pointing at where recorder positions live
        run: python scripts/check_no_location_disclosure.py
